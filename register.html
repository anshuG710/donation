<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Your Account | DONATE+</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root{
    --green:#1f5b3a;
    --green2:#2f744a;
    --orange:#f28c18;
    --cream:#fbfaf6;
    --ink:#171915;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'DM Sans',sans-serif;
    background:var(--cream);
    color:var(--ink);
}

.serif{
    font-family:'Playfair Display',serif;
}

a{
    text-decoration:none;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 20px;
    border-radius:10px;
    font-weight:700;
    transition:.2s;
    border:0;
    cursor:pointer;
}

.btn-green{
    background:var(--green);
    color:#fff;
}

.btn-green:hover{
    background:#17482e;
}

.auth{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:30px;
    background:
        radial-gradient(circle at 10% 10%,#edf4e9,transparent 25%),
        #fbfaf6;
}

.authbox{
    width:min(920px,100%);
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 20px 70px #20382018;
    border:1px solid #ebe7de;
}

.authvisual{
    background:var(--green);
    color:#fff;
    padding:45px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.authvisual h1{
    font-size:44px;
    line-height:1.05;
}

.authform{
    padding:45px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--green);
    font-weight:800;
}

.brandmark{
    width:38px;
    height:38px;
    border:2px solid var(--green);
    border-radius:50% 50% 45% 45%;
    display:grid;
    place-items:center;
    font-size:19px;
}

.brand small{
    display:block;
    font-size:9px;
    color:#7d857d;
    letter-spacing:.6px;
    font-weight:600;
}

.eyebrow{
    color:var(--green);
    font-weight:800;
    letter-spacing:1px;
    font-size:12px;
    text-transform:uppercase;
}

.field{
    margin-top:18px;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:7px;
}

.field input,
.field select{
    width:100%;
    padding:13px;
    border:1px solid #ddd9d1;
    border-radius:10px;
    outline:none;
    font-family:'DM Sans',sans-serif;
    font-size:14px;
}

.field input:focus,
.field select:focus{
    border-color:var(--green);
}

.error-message{
    display:none;
    background:#ffe9e9;
    color:#a12626;
    border:1px solid #f2bcbc;
    padding:10px 12px;
    border-radius:8px;
    font-size:12px;
    margin-top:15px;
}

@media(max-width:900px){

    .authbox{
        grid-template-columns:1fr;
    }

    .authvisual{
        display:none;
    }
}

@media(max-width:600px){

    .auth{
        padding:15px;
    }

    .authform{
        padding:30px 22px;
    }
}
</style>

</head>

<body>

<div class="auth">

    <div class="authbox">

        <!-- LEFT SIDE -->
        <div class="authvisual">

            <a class="brand" style="color:#fff" href="index.html">

                <span
                    class="brandmark"
                    style="border-color:#fff"
                >
                    ♡
                </span>

                <span>
                    DONATE+
                    <small style="color:#b9c9bd">
                        Give Today, Change Tomorrow
                    </small>
                </span>

            </a>

            <div style="margin-top:80px">

                <div
                    class="eyebrow"
                    style="color:#ffae42"
                >
                    Together we can
                </div>

                <h1
                    class="serif"
                    style="margin:12px 0"
                >
                    Small acts.<br>
                    Big impact.
                </h1>

                <p
                    style="
                    color:#d6e2d9;
                    line-height:1.8;
                    "
                >
                    Join a community making useful donations
                    available to people and organizations
                    across Nepal.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="authform">

            <a
                href="index.html"
                style="
                color:var(--green);
                font-weight:700;
                font-size:13px;
                "
            >
                ← Back to home
            </a>

            <h2
                class="serif"
                style="
                font-size:34px;
                margin-top:30px;
                "
            >
                Create Your Account
            </h2>

            <p
                style="
                color:#70776f;
                font-size:13px;
                "
            >
                Create an account to start donating
                or requesting items.
            </p>


            <!-- ERROR MESSAGE -->

            <div
                id="errorMessage"
                class="error-message"
            >
            </div>


            <!-- REGISTRATION FORM -->

            <form
                action="register.php"
                method="POST"
                style="margin-top:20px"
                onsubmit="return validateForm()"
            >

                <!-- FULL NAME -->

                <div class="field">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Your full name"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="field">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="98XXXXXXXX"
                        required
                    >

                </div>

                <!-- ADDRESS -->

                <div class="field">

                    <label>
                        Address
                    </label>

                    <input
                        type="text"
                        name="address"
                        placeholder="City, District"
                    >

                </div>


                <!-- ACCOUNT TYPE -->

                <div class="field">

                    <label>
                        Account Type
                    </label>

                    <select
                        name="role"
                        required
                    >

                        <option value="">
                            Select account type
                        </option>

                        <option value="donor">
                            Donor
                        </option>

                        <option value="recipient">
                            Recipient / Organization
                        </option>

                    </select>

                </div>


                <!-- EMAIL -->

                <div class="field">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="field">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        placeholder="Repeat password"
                        required
                    >

                </div>


                <!-- SECURITY QUESTION -->

                <div class="field">

                    <label>
                        Security Question
                    </label>

                    <select
                        name="security_question"
                        required
                    >

                        <option value="">
                            Select a question
                        </option>

                        <option value="What city were you born in?">
                            What city were you born in?
                        </option>

                        <option value="What is your mother tongue?">
                            What is your mother tongue?
                        </option>

                        <option value="What is your pet's name?">
                            What is your pet's name?
                        </option>

                        <option value="What is your favourite food?">
                            What is your favourite food?
                        </option>

                        <option value="What was the name of your first school?">
                            What was the name of your first school?
                        </option>

                    </select>

                </div>


                <!-- SECURITY ANSWER -->

                <div class="field">

                    <label>
                        Answer
                    </label>

                    <input
                        type="text"
                        name="security_answer"
                        placeholder="Your answer (remember this!)"
                        required
                    >

                </div>


                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="btn btn-green"
                    style="
                    width:100%;
                    margin-top:22px;
                    "
                >
                    Create Account
                </button>

            </form>


            <p
                style="
                font-size:13px;
                color:#777;
                text-align:center;
                margin-top:22px;
                "
            >
                Already have an account?

                <a
                    href="login.html"
                    style="
                    color:var(--green);
                    font-weight:700;
                    "
                >
                    Login
                </a>

            </p>

        </div>

    </div>

</div>


<script>

function validateForm(){

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm_password").value;

    const errorMessage =
        document.getElementById("errorMessage");


    if(password !== confirmPassword){

        errorMessage.style.display = "block";

        errorMessage.innerText =
            "Passwords do not match.";

        return false;
    }


    if(password.length < 6){

        errorMessage.style.display = "block";

        errorMessage.innerText =
            "Password must contain at least 6 characters.";

        return false;
    }


    return true;
}

</script>

</body>
</html>
